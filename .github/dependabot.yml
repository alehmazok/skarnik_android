version: 2
updates:
  # Reads gradle/libs.versions.toml and the Gradle wrapper.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      androidx-and-compose:
        patterns: ["androidx.*", "com.android.*"]
      kotlin-toolchain:
        # Kotlin, KSP and the Compose compiler move together.
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*", "org.jetbrains.kotlinx*"]
      other:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
