name: Baseline Profile

# Generates the app's Baseline Profile and startup profile on an emulator, commits them, and benchmarks cold start
# with and without the profile (docs/adr/0010). Run it from the Actions tab after changes to startup or the main
# screens; pull requests that change the generator run it too.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/baseline-profile.yml
      - baselineprofile/**

concurrency:
  group: baseline-profile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # On a pull request, the branch itself (not the merge commit), so the profile can be pushed to it.
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # Build the APKs before the emulator starts, so the emulator does not compete with Gradle for memory.
      - name: Build the app and the generator
        run: ./gradlew :app:assembleNonMinifiedRelease :baselineprofile:assembleNonMinifiedRelease

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Android 13+ generates profiles without root. Each script line runs in its own shell.
      - name: Generate the profile and benchmark startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew :app:generateReleaseBaselineProfile
            ./gradlew :baselineprofile:connectedBenchmarkReleaseAndroidTest -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark

      - name: Startup summary
        if: always()
        run: |
          {
            echo "### Cold start to History (emulator, median of 10)"
            echo
            echo "| Compilation | timeToInitialDisplay | timeToFullDisplay |"
            echo "|---|---|---|"
            find baselineprofile/build/outputs -name '*benchmarkData.json' -exec jq -r '.benchmarks[] |
              "| \(.name) | \(.metrics.timeToInitialDisplayMs.median // "–") ms | \(.metrics.timeToFullDisplayMs.median // "–") ms |"' {} \; 2>/dev/null || true
            echo
            for f in app/src/release/generated/baselineProfiles/*.txt; do
              if [ -f "$f" ]; then echo "$(basename "$f"): $(wc -l < "$f") rules"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: baseline-profile
          path: |
            app/src/release/generated/baselineProfiles/
            baselineprofile/build/outputs/
          retention-days: 14

      # Same-repository pull requests get the profile pushed to their branch; a manual run on main pushes it to the
      # baseline-profile/update branch and opens a pull request. CI is started by hand for the new commit.
      - name: Commit the profile
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git add app/src/release/generated/baselineProfiles/
          if git diff --cached --quiet; then
            echo "The profile is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the Baseline Profile"
          if [ "$SOURCE_BRANCH" = "main" ]; then
            TARGET=baseline-profile/update
            git push --force origin "HEAD:refs/heads/$TARGET"
            gh pr create --base main --head "$TARGET" --title "Update the Baseline Profile" \
              --body "Generated by the Baseline Profile workflow (run ${{ github.run_id }}); startup numbers are in its summary." \
              || echo "::notice::Pushed $TARGET; open its pull request by hand (Actions may not create pull requests here)."
          else
            TARGET=$SOURCE_BRANCH
            git push origin "HEAD:refs/heads/$TARGET"
          fi
          gh workflow run ci.yml --ref "$TARGET"
