name: Firebase App Distribution

# Every merge to main goes to the "internal" tester group as a signed, minified release APK (docs/adr/0005).
# Pull requests that touch the release build only build it, to catch signing and R8 problems before merge.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/distribute.yml
      - app/build.gradle.kts
      - app/proguard-rules.pro
      - gradle/libs.versions.toml

concurrency:
  group: distribute-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v7

      # Builds before this workflow were 100; each run gets a higher code so testers can install over it.
      - name: Version code
        run: echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore upload key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          cat > key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload.keystore
          EOF

      - name: Release APK
        run: ./gradlew assembleRelease -Pskarnik.versionCode="$VERSION_CODE"

      - name: Release notes
        run: |
          # A merge commit's body is the PR title; a direct push has its own subject.
          {
            git log -1 --format='%b' | sed '/^$/d' | head -5
            git log -1 --format='%s'
            echo
            echo "Commit ${GITHUB_SHA::7}, build $VERSION_CODE"
          } > app/build/outputs/release-notes.txt
          cat app/build/outputs/release-notes.txt >> "$GITHUB_STEP_SUMMARY"

      # Fails early if the upload key is wrong; prints only the certificate digest.
      - name: Check signature
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk | grep -i "SHA-256 digest"

      # Read-only calls with the service account: the API is reachable, it may read releases of the app,
      # and the tester group exists. Runs on PRs too, so a bad key shows up before a merge.
      - name: Check Firebase access
        if: env.HAS_FIREBASE_CREDENTIALS == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          API: https://firebaseappdistribution.googleapis.com/v1/projects/690309283484
          APP_ID: 1:690309283484:android:3c2521a8af9d651ad03759
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/firebase-sa.json" --quiet
          TOKEN=$(gcloud auth print-access-token)
          # Print only error bodies: a release list carries signed download links.
          check() {
            curl -sS --fail-with-body -o "$RUNNER_TEMP/response.json" -H "Authorization: Bearer $TOKEN" "$1" \
              || { cat "$RUNNER_TEMP/response.json"; return 1; }
          }
          check "$API/apps/$APP_ID/releases?pageSize=1"
          check "$API/groups/internal"
          echo "Firebase App Distribution access OK" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: skarnik-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/release-notes.txt
          retention-days: 30

  # Cold-starts the minified release APK on an emulator: R8 problems usually crash on launch, which the
  # debug-build e2e flows can't see.
  smoke:
    needs: distribute
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: skarnik-release
          path: release

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: .github/scripts/release-smoke.sh "$(ls release/apk/release/*.apk | head -1)"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-logcat
          path: release-logcat.txt
          retention-days: 14

  # Uploads only an APK that passed the smoke test.
  upload:
    needs: smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - uses: actions/download-artifact@v8
        with:
          name: skarnik-release
          path: release

      - name: Upload to Firebase App Distribution
        if: env.HAS_SIGNING_KEY == 'true' && env.HAS_FIREBASE_CREDENTIALS == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          ./gradlew appDistributionUploadRelease \
            --artifactPath="$(ls "$PWD"/release/apk/release/*.apk | head -1)" \
            --serviceCredentialsFile="$RUNNER_TEMP/firebase-sa.json" \
            --releaseNotesFile="$PWD/release/release-notes.txt"

      - name: Missing secrets
        if: env.HAS_SIGNING_KEY != 'true' || env.HAS_FIREBASE_CREDENTIALS != 'true'
        run: |
          echo "::warning::Not uploaded: add ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS and FIREBASE_SERVICE_ACCOUNT_JSON repository secrets (README, Release build)."
