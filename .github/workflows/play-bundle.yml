name: Play release bundle

# Manual only: builds the signed, minified release AAB for Google Play and keeps it as a workflow artifact
# (parity 10.1). Upload the AAB to Play Console by hand. Uses the same upload-key secrets as distribute.yml.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Version code. Leave empty to use the latest Firebase App Distribution build + 1.
        required: false
        # A string, not a number: GitHub passes number inputs as floats ("199.0"), which Gradle can't read.
        type: string

concurrency:
  group: play-bundle
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ inputs.version_code }}
      HAS_FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
      HAS_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check signing secrets
        env:
          HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          if [ "$HAS_SIGNING_KEY" != "true" ]; then
            echo "::error::Play needs a signed bundle: add the ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets (README)."
            exit 1
          fi

      # Every push to main uploads a tester build to Firebase (distribute.yml, code = 100 + run number), so the newest
      # Firebase release holds the highest code so far; the Play build goes one above it.
      - name: Version code from Firebase App Distribution
        if: env.VERSION_CODE == ''
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          API: https://firebaseappdistribution.googleapis.com/v1/projects/690309283484
          APP_ID: 1:690309283484:android:3c2521a8af9d651ad03759
        run: |
          if [ "$HAS_FIREBASE_CREDENTIALS" != "true" ]; then
            echo "::error::Enter a version code, or add the FIREBASE_SERVICE_ACCOUNT_JSON secret so it can be read from Firebase."
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/firebase-sa.json" --quiet
          rm "$RUNNER_TEMP/firebase-sa.json"
          # Releases come newest first. Keep only the build numbers: the list carries signed download links.
          curl -sS --fail-with-body -o "$RUNNER_TEMP/releases.json" \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            "$API/apps/$APP_ID/releases?pageSize=20" || { cat "$RUNNER_TEMP/releases.json"; exit 1; }
          LATEST=$(jq -r '[.releases[]?.buildVersion | select(test("^[0-9]+$")) | tonumber] | max // empty' \
            "$RUNNER_TEMP/releases.json")
          rm "$RUNNER_TEMP/releases.json"
          if [ -z "$LATEST" ]; then
            echo "::error::No Firebase App Distribution release found; enter a version code by hand."
            exit 1
          fi
          echo "Latest Firebase build: $LATEST"
          echo "VERSION_CODE=$((LATEST + 1))" >> "$GITHUB_ENV"

      - name: Check version code
        run: |
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || [ "$VERSION_CODE" -le 81 ]; then
            echo "::error::version_code must be a whole number above 81 (Flutter's last Play build)."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          cat > key.properties <<KEYS
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload.keystore
          KEYS

      # Crash reporting (docs/adr/0008): Play builds report as environment "production"; the UUID ties their
      # crashes to the R8 mapping uploaded below.
      - name: Release bundle
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          SENTRY_PROGUARD_UUID=$(cat /proc/sys/kernel/random/uuid)
          ./gradlew bundleRelease -Pskarnik.versionCode="$VERSION_CODE" \
            -Pskarnik.sentryEnvironment=production -Pskarnik.sentryProguardUuid="$SENTRY_PROGUARD_UUID"
          echo "$SENTRY_PROGUARD_UUID" > app/build/outputs/mapping/release/sentry-proguard-uuid.txt
          if [ -z "$SENTRY_DSN" ]; then echo "::warning::SENTRY_DSN is not set: this build reports no crashes."; fi

      # Fails if the bundle is not signed; prints only the certificate's SHA-256, which must match the Play upload key.
      - name: Check signature
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | grep -q "jar verified" || { echo "::error::The bundle is not signed."; exit 1; }
          keytool -printcert -jarfile "$AAB" | grep -i "SHA256:"

      - name: Upload R8 mapping to Sentry
        if: env.HAS_SENTRY_AUTH_TOKEN == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: skarnik
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'skarnik_android' }}
        run: |
          npx --yes @sentry/cli@3.5.0 upload-proguard \
            --uuid "$(cat app/build/outputs/mapping/release/sentry-proguard-uuid.txt)" \
            app/build/outputs/mapping/release/mapping.txt

      - name: No Sentry mapping upload
        if: env.HAS_SENTRY_AUTH_TOKEN != 'true'
        run: echo "::warning::R8 mapping not sent to Sentry; add the SENTRY_AUTH_TOKEN repository secret (README)."

      - name: Summary
        run: |
          {
            echo "### Play release bundle"
            echo
            echo "Version code **$VERSION_CODE**${{ inputs.version_code == '' && ' (latest Firebase build + 1)' || '' }}, commit \`${GITHUB_SHA::7}\`."
            echo "Download the \`skarnik-play-$VERSION_CODE\` artifact, then upload \`app-release.aab\` in Play Console"
            echo "and \`mapping.txt\` under the release's App bundle explorer → Downloads → ReTrace mapping file."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: skarnik-play-${{ env.VERSION_CODE }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/mapping/release/sentry-proguard-uuid.txt
          retention-days: 90
