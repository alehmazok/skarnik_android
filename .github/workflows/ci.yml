name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Static checks
        run: ./gradlew ktlintCheck detekt lintDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Debug APK
        run: ./gradlew assembleDebug

      # The ObjectBox processor rewrites the model file when entities change. Any change here
      # must be reviewed against skarnik-flutter's lib/objectbox-model.json (docs/adr/0001).
      - name: ObjectBox model unchanged
        run: git diff --exit-code -- app/objectbox-models/

      - name: APK size
        run: |
          ls -l app/build/outputs/apk/debug/*.apk
          echo "Debug APK: $(du -h app/build/outputs/apk/debug/*.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: skarnik-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/download-artifact@v8
        with:
          name: skarnik-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r apk/*.apk
            mkdir -p maestro-out
            # Stream logcat to a file from the start, so a device that drops off adb still leaves its last log.
            (adb logcat -b main,system,crash -v time > maestro-out/logcat-live.txt 2>&1 &)
            cd maestro-out && maestro test ../.maestro/ --format junit --output report.xml || (adb devices; maestro test ../.maestro/dictionary.yaml >/dev/null 2>&1; adb shell uiautomator dump /sdcard/dict.xml >/dev/null; echo "--- dictionary screen ---"; adb shell cat /sdcard/dict.xml | tr ">" "\n" | grep -E "vocabulary_|home_tab" | head -80; grep -E "AndroidRuntime|FATAL|lowmemorykiller|lmkd|Watchdog|adbd|VocabularyViewModel" logcat-live.txt | tail -80; tail -40 logcat-live.txt; adb logcat -d > logcat.txt; grep -E "AndroidRuntime|FATAL|HistoryViewModel|BookmarksViewModel|VocabularyViewModel|FlutterPreferences|SearchViewModel|TranslationViewModel|GetTranslation|ObjectBox" logcat.txt | tail -60; adb shell uiautomator dump /sdcard/ui.xml >/dev/null; adb shell cat /sdcard/ui.xml; exit 1)

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maestro-results
          path: |
            maestro-out/
            ~/.maestro/tests/
          retention-days: 14
