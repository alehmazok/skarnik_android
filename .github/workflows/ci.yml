name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The baseline-profile workflow starts CI for the profile commit it pushes (pushes by GITHUB_TOKEN start nothing).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Static checks
        run: ./gradlew ktlintCheck detekt lintDebug

      # Release manifest (docs/adr/0007): no advertising-id permission may come back with a dependency update.
      - name: Manifest permissions
        run: ./gradlew checkReleaseManifestPermissions

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Debug APK
        run: ./gradlew assembleDebug

      # The ObjectBox processor rewrites the model file when entities change. Any change here
      # must be reviewed against skarnik-flutter's lib/objectbox-model.json (docs/adr/0001).
      - name: ObjectBox model unchanged
        run: git diff --exit-code -- app/objectbox-models/

      - name: APK size
        run: |
          ls -l app/build/outputs/apk/debug/*.apk
          echo "Debug APK: $(du -h app/build/outputs/apk/debug/*.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: skarnik-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  e2e:
    needs: build
    runs-on: ubuntu-latest
    # One Maestro session per flow adds about 10 s per flow, and a retried flow can add a few minutes.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/download-artifact@v8
        with:
          name: skarnik-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The emulator used to drop off adb for a few seconds under load, most often right after the Offline
      # dictionaries flow writes ~97k ТСБМ words into ObjectBox, and every later flow then failed. It gets all four
      # runner cores and more RAM, and maestro-flows.sh runs one Maestro session per flow, waits for the device
      # before each and re-runs a flow once only when the device went away during it.
      - name: Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb install -r apk/*.apk
            # The emulator cannot verify app links (no assetlinks.json for the debug key), so approve the link
            # hosts for the debug app as a user would ("Open supported links"); .maestro/app-links.yaml needs it.
            adb shell pm set-app-links-user-selection --user 0 --package by.mazokaleh.skarnik.debug true all
            .github/scripts/maestro-flows.sh maestro-out .maestro/*.yaml
            # Wide-screen flows (parity 0.5): the same emulator as a 1280x800 dp tablet in landscape.
            adb shell wm size 1280x800
            adb shell wm density 160
            .github/scripts/maestro-flows.sh maestro-out .maestro/wide/*.yaml

      - name: Maestro and process log on failure
        if: failure()
        run: |
          # Which step failed in which flow: the JUnit report has every failure, the log the commands around it.
          grep -o '<testcase[^>]*name="[^"]*"\|<failure[^<]*' maestro-out/report*.xml | grep -B1 '<failure' || true
          grep -h -B12 -E "FAILED" ~/.maestro/tests/*/maestro.log | cut -c1-300 | head -150 || true
          # Why the driver lost the device: process deaths (maestro-flows.sh prints each failed flow's own log).
          grep -hE "Process .* (died|has died)|Killing|am_kill|instrumentation|dev.mobile.maestro" maestro-out/logcat-*.txt | tail -60 || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maestro-results
          path: |
            maestro-out/
            ~/.maestro/tests/
          retention-days: 14
