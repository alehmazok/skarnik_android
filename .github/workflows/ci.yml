name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Static checks
        run: ./gradlew ktlintCheck detekt lintDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Debug APK
        run: ./gradlew assembleDebug

      # The ObjectBox processor rewrites the model file when entities change. Any change here
      # must be reviewed against skarnik-flutter's lib/objectbox-model.json (docs/adr/0001).
      - name: ObjectBox model unchanged
        run: git diff --exit-code -- app/objectbox-models/

      - name: APK size
        run: |
          ls -l app/build/outputs/apk/debug/*.apk
          echo "Debug APK: $(du -h app/build/outputs/apk/debug/*.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: skarnik-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
