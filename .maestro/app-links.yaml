# App links (parity 9.1): a skarnik.by link starts the app on that word; a skarnik.app share link opens over a
# running app. The debug app is not verified for the link hosts, so approve them once after installing, as CI does:
#   adb shell pm set-app-links-user-selection --user 0 --package by.mazokaleh.skarnik.debug true all
# Needs network: translations come from the admin API (or Supabase).
appId: by.mazokaleh.skarnik.debug
name: Open words from skarnik.by and skarnik.app links
tags:
  - links
---
- clearState
# Cold start from a legacy site link (Russian-Belarusian «нерв»).
- openLink:
    link: "https://www.skarnik.by/rusbel/47880"
# The consent dialog shows over the opened word.
- runFlow: subflows/decline-analytics.yaml
- extendedWaitUntil:
    visible:
      id: translation_text
    timeout: 60000
- assertVisible:
    id: translation_word
    text: "нерв"
- takeScreenshot: app-link-cold-start
# A share link while the app runs replaces the open word (onNewIntent).
- openLink:
    link: "https://skarnik.app/r/belrus/27890"
- extendedWaitUntil:
    notVisible:
      id: translation_word
      text: "нерв"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: translation_text
    timeout: 60000
- assertNotVisible:
    id: translation_error
- takeScreenshot: app-link-share-link
# Back goes to the start screen, not to the previous word: links open over History.
- back
- extendedWaitUntil:
    visible:
      id: home_search
    timeout: 10000
