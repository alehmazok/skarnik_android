# Smoke test: a clean install starts, installs the search seed, opens the stores and shows empty history.
appId: by.mazokaleh.skarnik.debug
name: App starts and opens the dictionary
tags:
  - smoke
---
- launchApp:
    clearState: true
# First launch unpacks the 60 MB search index, so allow time on a slow CI emulator.
- extendedWaitUntil:
    visible:
      id: history_empty
    timeout: 60000
- assertVisible: "Пачніце ўводзіць слова ў пошук…"
- assertVisible:
    id: home_tab_bookmarks
- takeScreenshot: smoke-home
