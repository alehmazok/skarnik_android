# Settings: switch the theme, clear search history (bookmarks stay), open «Што новага» and «Пра Скарнік».
# Opening a word needs network, like the other flows.
appId: by.mazokaleh.skarnik.debug
name: Settings
tags:
  - settings
---
- launchApp:
    clearState: true
- runFlow: subflows/decline-analytics.yaml
- extendedWaitUntil:
    visible:
      id: history_empty
    timeout: 60000

# Put a word in history: open the first ТСБМ word from the Dictionary tab.
- tapOn:
    id: home_tab_dictionary
- extendedWaitUntil:
    visible:
      id: vocabulary_item
    timeout: 30000
- tapOn:
    id: vocabulary_item
    index: 0
- extendedWaitUntil:
    visible:
      id: translation_text
    timeout: 30000
- back
- tapOn:
    id: home_tab_history
- assertNotVisible:
    id: history_empty

# Theme: the dialog applies the choice at once.
- tapOn:
    id: settings_button
- scrollUntilVisible:
    element:
      id: settings_theme
- assertVisible:
    id: settings_theme_value
    text: "Як у сістэме"
- tapOn:
    id: settings_theme
# Dialogs are separate windows without test tags as ids, so options are picked by their text.
- tapOn: "Цёмная"
- assertVisible:
    id: settings_theme_value
    text: "Цёмная"
- takeScreenshot: settings-dark

# Clear history after confirming.
- scrollUntilVisible:
    element:
      id: settings_clear_history
- tapOn:
    id: settings_clear_history
- assertVisible: "Ачысціць гісторыю пошуку?"
- tapOn: "Ачысціць"
- assertVisible: "Гісторыя паспяхова ачышчана."

# What's new: the list of every release. A clean install never shows the sheet by itself. Sheets are separate
# windows without test tags as ids, so their content is matched by text.
- assertNotVisible: "Што новага ў Скарніку"
- scrollUntilVisible:
    element:
      id: settings_whats_new
- tapOn:
    id: settings_whats_new
- extendedWaitUntil:
    visible: "Версія 4.0.0"
    timeout: 10000
- assertVisible: "Цалкам новая праграма"
- takeScreenshot: settings-whats-new
- back

# About sheet. It opens fully expanded, so its links are on screen too.
- scrollUntilVisible:
    element:
      id: settings_about
- tapOn:
    id: settings_about
- extendedWaitUntil:
    visible: "(?s)Гэтая праграма — Android-кліент сайта skarnik\\.by.*"
    timeout: 10000
- assertVisible: "Карысныя спасылкі"
- takeScreenshot: settings-about
- back

# History is empty again.
- tapOn:
    id: settings_back
- assertVisible:
    id: history_empty
