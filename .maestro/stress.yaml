# Stress: open a ТСБМ word, tap «На́ціск», read its stress table, go back to the translation.
# Needs network: the table comes from starnik.by (or skarnik_admin when starnik.by has nothing).
appId: by.mazokaleh.skarnik.debug
name: Stress table
tags:
  - stress
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: history_empty
    timeout: 60000
- tapOn:
    id: home_search
- inputText: вада
# Open the ТСБМ entry: its headword is the stress candidate, so the chip opens the lookup straight away.
- extendedWaitUntil:
    visible:
      text: "Тлумачэнне слова"
      childOf:
        id: search_result
    timeout: 10000
- tapOn:
    text: "Тлумачэнне слова"
    childOf:
      id: search_result
    index: 0
- extendedWaitUntil:
    visible:
      id: translation_text
    timeout: 30000
- takeScreenshot: stress-translation-chip
- tapOn:
    id: translation_stress
- extendedWaitUntil:
    visible:
      id: stress_back
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: stress_loading
    timeout: 30000
# Homographs show a list first; one match opens its table directly.
- runFlow:
    when:
      visible:
        id: stress_choice
    commands:
      - takeScreenshot: stress-choose
      - tapOn:
          id: stress_choice
          index: 0
      - extendedWaitUntil:
          notVisible:
            id: stress_loading
          timeout: 30000
- extendedWaitUntil:
    visible:
      id: stress_cell
    timeout: 30000
- assertVisible:
    id: stress_word
- assertNotVisible:
    id: stress_error
- takeScreenshot: stress-table
- back
- runFlow:
    when:
      visible:
        id: stress_choice
    commands:
      - back
- assertVisible:
    id: translation_text
