# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
naming:
  FunctionNaming:
    # Composables are PascalCase.
    ignoreAnnotated: ['Composable']
  MatchingDeclarationName:
    active: false

complexity:
  LongParameterList:
    # Composables commonly take many optional parameters.
    ignoreAnnotated: ['Composable']
    functionThreshold: 8

style:
  MagicNumber:
    # @Uid values are ObjectBox model IDs copied from the Flutter model.
    ignoreAnnotation: true
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    excludes: ['**/test/**', '**/ui/theme/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
