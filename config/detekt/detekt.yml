# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
naming:
  FunctionNaming:
    # Composables are PascalCase.
    ignoreAnnotated: ['Composable']
  MatchingDeclarationName:
    active: false

complexity:
  LongParameterList:
    # Composables commonly take many optional parameters.
    ignoreAnnotated: ['Composable']
    functionThreshold: 8
    # Hilt ViewModels take the assisted route plus their repositories; 8 fits a screen like Translation.
    constructorThreshold: 8

style:
  MagicNumber:
    # @Uid values are ObjectBox model IDs copied from the Flutter model.
    ignoreAnnotation: true
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    # Compose UI is full of dp/sp literals; logic code stays checked.
    excludes: ['**/test/**', '**/ui/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
